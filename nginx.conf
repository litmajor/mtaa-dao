# MtaaDAO Production NGINX Configuration
# Optimized for High Concurrency, JWT/IP Rate-Limiting, Security & Backend Scaling

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535; # Prevents 'Too many open files' OS errors under heavy load
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192; # Increased from 2048 (Handles ~4,000-32,000 concurrent users depending on CPU count)
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Detailed Logging Format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Network & Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;
    server_tokens off; # Hides NGINX version

    # Compression Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;

    # Smart Rate-Limiting Key Logic
    # Limits authenticated users by JWT token, and unauthenticated users by IP
    # Prevents entire offices or mobile carrier networks from sharing a single IP limit block
    map $http_authorization $limit_key {
        default $binary_remote_addr;
        "~^Bearer\s+(.+)$" $1;
    }

    # Rate Limiting Zones
    limit_req_zone $limit_key zone=api_limit:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Backend Upstreams (Pre-warmed connection pools)
    upstream api {
        least_conn;
        server api:5000 max_fails=3 fail_timeout=30s;
        keepalive 128; # High keepalive pool reduces backend TCP handshake overhead
    }

    upstream frontend {
        least_conn;
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # HTTP to HTTPS Global Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name mtaadao.com www.mtaadao.com;

        # Certbot/Let's Encrypt validation pathway
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Force HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server Block
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on; # Modern directive replacing legacy 'listen 443 ssl http2'
        server_name mtaadao.com www.mtaadao.com;

        # TLS/SSL Security Parameters
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Global Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

        # Health Check
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Metrics Endpoint (Internal Only)
        location /metrics {
            allow 172.16.0.0/12; # Docker network space
            allow 10.0.0.0/8;     # Internal private network
            deny all;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn addr 20;

            proxy_pass http://api;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # WebSockets Endpoint
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reduced read timeout prevents socket starvation from idle/ghost clients
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Static Assets (Proxied to Frontend Service)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Re-declared essential headers (child add_header blocks strip parent headers)
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Frontend Application Root
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Deny access to hidden/sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}