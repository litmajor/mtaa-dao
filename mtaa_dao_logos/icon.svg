<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mtaa-stroke { stroke: #FF6E16; fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .mtaa-node { fill: #FF6E16; }
      .mtaa-node-hole { fill: #1A1B1D; }
    </style>
  </defs>

  <!-- outer ring -->
  <circle class="mtaa-stroke" cx="200" cy="200" r="150"/>

  <!-- M glyph, circuit style -->
  <path class="mtaa-stroke" d="M 108 260 L 108 170 L 155 130 L 200 175 L 245 130 L 292 170 L 292 260"/>
  <path class="mtaa-stroke" d="M 155 260 L 155 200 L 200 245 L 245 200 L 245 260"/>

  <!-- orbit nodes (top, bottom, left, right) -->
  <g>
    <circle class="mtaa-node" cx="200" cy="50" r="20"/>
    <circle class="mtaa-node-hole" cx="200" cy="50" r="9"/>
  </g>
  <g>
    <circle class="mtaa-node" cx="200" cy="350" r="20"/>
    <circle class="mtaa-node-hole" cx="200" cy="350" r="9"/>
  </g>
  <g>
    <circle class="mtaa-node" cx="50" cy="200" r="20"/>
    <circle class="mtaa-node-hole" cx="50" cy="200" r="9"/>
  </g>
  <g>
    <circle class="mtaa-node" cx="350" cy="200" r="20"/>
    <circle class="mtaa-node-hole" cx="350" cy="200" r="9"/>
  </g>
</svg>
